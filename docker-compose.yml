services:
  db:
    image: postgres:16-alpine
    container_name: tc-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TienditaCampus2026DB!}
      POSTGRES_DB: ${POSTGRES_DB:-tienditacampus}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tc_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tc-backend
    restart: always
    environment:
      NODE_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tienditacampus}
      POSTGRES_USER: ${POSTGRES_USER:-tc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TienditaCampus2026DB!}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-tienditacampus-2026}
      POSTGRES_SYNCHRONIZE: "true"
      BACKEND_PORT: 3001
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:3001/api}
    container_name: tc-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      BACKEND_PROXY_URL: ${BACKEND_PROXY_URL:-http://backend:3001/api}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

networks:
  default:
    name: tc-network

volumes:
  postgres_data:
